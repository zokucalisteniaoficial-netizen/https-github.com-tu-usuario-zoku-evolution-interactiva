<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1712"><title>Control Corporal</title><meta name="description" content="Descubre cómo desarrollar fuerza, estabilidad y control corporal con dirección y progresiones claras."><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#eef7f0;background:#09130f;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 80% 10%,#21452d 0,transparent 48%),#09130f}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ffae68;outline-offset:3px}.shell{max-width:1080px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:24px clamp(16px,4vw,48px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:950;font-size:23px;letter-spacing:.09em;color:#b0ffb9}.logo span{color:#ff9c52}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;color:#9be5ab;text-transform:uppercase}.counter{color:#b2c7b8;font-size:13px}.progress{height:5px;background:#2b4033;border-radius:99px;overflow:hidden;margin-top:20px}.bar{height:100%;width:0;background:linear-gradient(90deg,#70d98c,#ffa45d);transition:width .35s}.main{flex:1;display:grid;align-items:center;grid-template-columns:1.2fr .8fr;gap:clamp(18px,5vw,65px);padding:30px 0}.panel{animation:appear .28s ease-out}.title{font-size:clamp(30px,4.4vw,55px);letter-spacing:-.045em;line-height:1.08;margin:13px 0 16px}.lead{color:#d1ded4;font-size:clamp(15px,1.8vw,19px);line-height:1.65;max-width:650px}.choices{display:grid;gap:10px;margin-top:26px}.choice{border:1px solid #476351;background:#172a1e;color:#f2fff3;text-align:left;padding:16px 18px;border-radius:15px;display:flex;justify-content:space-between;align-items:center;gap:14px;transition:.18s}.choice:hover,.choice.selected{border-color:#a6f6b5;background:#23452d;transform:translateY(-1px)}.choice .arrow{color:#9df1a8}.reply{margin-top:18px;padding:18px;border-left:3px solid #92e6a2;background:#1b3324;border-radius:0 12px 12px 0;line-height:1.65;color:#e1eee4}.reply strong{display:block;color:#9eebb0;margin-bottom:7px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:12px;padding:14px 22px;font-weight:800;background:#a3edaa;color:#0b2010;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{background:#c1ffca}.btn.secondary{background:#203529;color:#e8f5eb;border:1px solid #4a6854}.btn:disabled{opacity:.4;cursor:not-allowed}.visual{min-height:340px;border:1px solid #3a5843;border-radius:26px;background:linear-gradient(150deg,#20402c,#11241a 65%);padding:26px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.visual:before{content:"";position:absolute;width:230px;height:230px;border:1px solid #45664c;border-radius:50%;right:-70px;top:-60px;box-shadow:0 0 0 50px #1c392a55,0 0 0 100px #1c392a33}.visual>*{position:relative}.visual .symbol{font-size:68px;margin-bottom:25px}.visual h2{font-size:27px;margin:0 0 12px}.visual p{color:#c5d9c9;line-height:1.55}.mini{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.pill{font-size:12px;border:1px solid #63876a;border-radius:99px;padding:7px 11px;color:#baf3c2}.demo-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.demo-tabs button{border:1px solid #4d6d54;background:#1a3223;color:#e4f5e8;padding:11px 14px;border-radius:10px}.demo-tabs button.active{background:#a3edaa;color:#122517}.checklist{display:grid;gap:12px;margin-top:18px}.check{display:flex;gap:10px;color:#e1efe3}.check:before{content:'✓';color:#a0ecac;font-weight:900}.price{font-size:52px;font-weight:900;letter-spacing:-.05em;margin:10px 0}.old{color:#9db1a3;text-decoration:line-through}.code{border:1px dashed #88c798;background:#1d3927;border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.code strong{letter-spacing:.09em;overflow-wrap:anywhere}.tiny{font-size:12px;color:#a7c0ad;line-height:1.5}.summary{background:#1b3324;border-radius:15px;padding:18px;margin-top:15px;line-height:1.6}.footer{color:#91ac99;font-size:12px;padding-bottom:6px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.footer button{background:none;border:0;color:#a7dcb0;text-decoration:underline;padding:0}.notice{margin-top:12px;color:#d3dfd5;font-size:13px}.hide{display:none!important}.code-preview{background:#0c1e14;border:1px solid #54765b;border-radius:16px;padding:18px;margin-top:18px}.code-preview .sample{font-size:20px;font-weight:900;letter-spacing:.08em;color:#b5ffc3}.code-preview .weekdays{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:14px}.code-preview .day{background:#244832;border-radius:9px;padding:10px 5px;text-align:center;font-size:11px;color:#d9f7df}.code-preview small{display:block;color:#9ccbaa;margin-top:6px;font-size:10px}.demo-note{color:#b9d3bf;font-size:12px;line-height:1.5;margin-top:12px}@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@media(max-width:760px){.shell{padding:17px}.main{grid-template-columns:1fr;align-content:start;padding:28px 0;gap:20px}.visual{min-height:170px;padding:20px}.visual .symbol{font-size:40px;margin-bottom:8px}.visual h2{font-size:21px}.visual p{font-size:13px}.title{font-size:clamp(29px,8vw,43px)}.lead{font-size:15px}.choice{padding:14px}.footer{margin-top:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style><script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"d2ad7e9c3490422ea23deda0137143a2"}'></script></head><body><div class="shell"><header><div class="logo">ZOKU <span>EVOLUTION</span></div><div class="counter" id="counter">01 / 08</div></header><div class="progress" aria-label="Progreso de la experiencia"><div class="bar" id="bar"></div></div><main class="main"><section class="panel" id="content" aria-live="polite"></section><aside class="visual" id="visual" aria-label="Información de ZOKU"></aside></main><footer class="footer"><span>Control de tu cuerpo · ZOKU Calistenia</span><button id="reset">Volver al inicio</button></footer></div><script>
const CHECKOUT='https://zokucalistenia.schoolmaker.co/purchases/new?price_id=f13ddf89-cd2e-4a0d-ac5a-f6eed6537a8d';const CODE='ZOKU745EVOL';
const data={goal:null,difficulty:null,strength:null,obstacle:null,help:null};let step=0,demo=0;
const questions=[{key:'goal',tag:'01 · TU OBJETIVO',title:'¿Qué te gustaría conseguir con tu cuerpo?',lead:'Puedes entrenar durante meses y seguir sin conseguir una habilidad. No siempre se trata de entrenar más, sino de desarrollar las capacidades que esa habilidad exige.',choices:[['skills','Dominar habilidades como el pino o front lever','Practicar un pino o un front lever es importante, pero repetir intentos no siempre desarrolla lo que falta. La fuerza específica, la estabilidad y el control de la posición necesitan su propio trabajo. Podemos construir esas capacidades mientras practicas la habilidad.'],['capacity','Desarrollar más fuerza, estabilidad y control','La fuerza no se expresa igual en todas las posiciones. Sostener una línea corporal o mover las escápulas con precisión exige coordinación y estabilidad además de fuerza. Por eso el trabajo técnico y de base tiene un lugar propio.'],['direction','Dejar de entrenar sin una dirección clara','Cuando cada semana eliges ejercicios sin un criterio, cuesta saber qué estás construyendo. Tener un punto de partida, una secuencia de trabajo y registros te ayuda a decidir qué mantener y qué cambiar.']]},{key:'difficulty',tag:'02 · TU DIFICULTAD',title:'¿Qué es lo que más te cuesta al intentar progresar?',lead:'Quiero entender qué te está frenando para mostrarte qué parte del sistema puede ayudarte.',choices:[['exercises','No sé qué ejercicios debería trabajar.','No todos los ejercicios resuelven la misma necesidad. Si primero identificas qué puedes sostener, empujar y controlar, resulta más fácil seleccionar progresiones con sentido. En ZOKU eso comienza con el test inicial, una vez dentro del programa.'],['progression','No sé cuándo aumentar la dificultad.','Subir de variante por completar una sola serie puede ser prematuro. La calidad de la ejecución, el control y la repetición de resultados importan. Por eso ZOKU utiliza los registros de tus sesiones para orientar cuándo mantener o avanzar.'],['stuck','Entreno, pero siento que no avanzo.','Un estancamiento puede tener distintas causas: progresiones demasiado exigentes, poca recuperación o falta de seguimiento. Registrar la calidad, las repeticiones y los tiempos ayuda a ver qué ha cambiado y qué conviene ajustar.'],['beginner','Estoy comenzando y no sé por dónde ir.','Comenzar por una variante sencilla no es retroceder: permite aprender a colocar el cuerpo y ganar fuerza con buena técnica. Dentro de ZOKU, el test inicial sirve para ubicar un punto de partida antes de elegir progresiones.']]},{key:'strength',tag:'03 · TU ENTRENAMIENTO',title:'¿Actualmente ya sigues una rutina de fuerza?',lead:'ZOKU Control tiene una estructura propia. Lo que cambia es cómo lo incorporas a tu entrenamiento.',choices:[['yes','Sí, ya tengo una rutina de fuerza.','No tienes que abandonar tu rutina. ZOKU Control puede complementar tu trabajo con estabilidad, fuerza específica y técnica. Será importante organizar la carga total y la recuperación.'],['no','No, todavía no tengo una rutina.','ZOKU Control puede ser tu entrenamiento principal. Si necesitas desarrollar fuerza general, puedes solicitar al equipo ZOKU una propuesta complementaria, evitando acumular trabajo innecesario.']]},{key:'obstacle',tag:'04 · TU DÍA A DÍA',title:'¿Qué suele complicarte más al mantener un entrenamiento?',lead:'Un proceso útil también tiene que ser claro en la práctica cotidiana.',choices:[['time','No siempre tengo suficiente tiempo.','Cuando el tiempo es limitado, improvisar suele gastar parte de la sesión. ZOKU propone cinco sesiones de unos 40 minutos para que sepas qué trabajar. También necesitas valorar si esa frecuencia encaja con tu semana y tu recuperación.'],['organization','No sé cómo organizar lo que entreno.','Trabajar fuerza, técnica y recuperación sin orden puede hacer que interfieran entre sí. Una semana estructurada permite distribuir los estímulos y registrar los resultados que servirán para decidir la siguiente.'],['motivation','Pierdo constancia cuando no veo resultados.','Si solo miras cuándo consigues una habilidad completa, puedes pasar por alto avances pequeños. Registrar mejores posiciones, segundos de control y ejecuciones más limpias permite reconocer cambios sin depender de la motivación del día.']]},{key:'help',tag:'06 · ACOMPAÑAMIENTO',title:'Cuando tienes dudas sobre un ejercicio, ¿qué sueles hacer?',lead:'Aprender a entrenar también implica saber dónde resolver tus preguntas.',choices:[['search','Busco videos o información por mi cuenta.','Buscar videos ayuda, pero distintas explicaciones pueden contradecirse o referirse a niveles diferentes. Tener una biblioteca común y un foro semanal te da un lugar donde contrastar dudas con el equipo ZOKU.'],['guess','Intento resolverlo como puedo.','Cuando una posición no sale, cambiar cosas al azar dificulta saber qué funcionó. Revisar la explicación del ejercicio y formular una duda concreta en el foro semanal puede darte una referencia más clara.'],['support','Me gustaría tener a quién preguntar.','Tener preguntas durante una progresión es normal, especialmente al cambiar de variante. Dentro de ZOKU hay un foro semanal para plantearlas al equipo; no se trata de supervisión individual en tiempo real.']]}];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const goalHead={skills:'Tu camino hacia las habilidades de calistenia',capacity:'Tu camino hacia un mayor dominio corporal',direction:'Tu camino hacia un entrenamiento con propósito'};
const difficultyHead={exercises:'Comienza con un test inicial y progresiones acordes a tu punto de partida.',progression:'Registra tus resultados para orientar cuándo mantener o aumentar la dificultad.',stuck:'Observa tu evolución y utiliza cada semana para tomar mejores decisiones.',beginner:'Construye las bases necesarias antes de avanzar hacia variantes más exigentes.'};
const obstacleHead={time:'Con el tiempo que tienes, lo importante será mantener una estructura que puedas cumplir y recuperar.',organization:'La organización semanal te permite saber qué priorizar sin mezclar estímulos al azar.',motivation:'Registrar pequeños avances puede ayudarte a sostener el proceso cuando una habilidad todavía no sale.'};
const helpHead={search:'Si acostumbras buscar videos por tu cuenta, contar con explicaciones comunes y un foro semanal puede darte mayor claridad.',guess:'Si sueles probar por intuición, consultar una referencia técnica puede evitar cambios sin criterio.',support:'Si prefieres hacer preguntas, el foro semanal ofrece un espacio para plantearlas al equipo ZOKU.'};
const strengthHead={yes:'Ya entrenas fuerza: Control puede complementar lo que haces, siempre organizando la carga y la recuperación.',no:'Todavía no sigues una rutina: Control puede ser la estructura principal, y puedes solicitar una propuesta adicional de fuerza general si la necesitas.'};
const offerHead={skills:'Si buscas dominar habilidades, la propuesta es desarrollar las capacidades que te permiten practicarlas con mayor control.',capacity:'Si buscas fuerza y estabilidad, la propuesta es entrenarlas en posiciones y progresiones concretas.',direction:'Si buscas dirección, la propuesta es pasar de rutinas sueltas a semanas con un propósito y seguimiento.'};
const demoItems=[{name:'Test',title:'Tu test y tu Código Personal ZOKU',body:'Realizas un test inicial para conocer tu punto de partida. Recibes tu Código Personal ZOKU, una clave para consultar tu semana y sus progresiones. No es un código de descuento.',tag:'Test inicial y progresiones organizadas',symbol:'◎'},{name:'Tu semana',title:'Después, sabes qué entrenar',body:'Con tu Código Personal ZOKU consultas la semana que te corresponde: cinco sesiones organizadas de base, técnica y control corporal.',tag:'Sesiones guiadas y ejercicios explicados',symbol:'▦'},{name:'Progreso',title:'Tus resultados ayudan a decidir qué sigue',body:'Registras tus series y resultados para orientar los ajustes de la siguiente semana según los criterios del sistema.',tag:'Seguimiento y decisiones de progresión',symbol:'↗'}];
function weeklyPreview(){return `<div class="code-preview"><div class="eyebrow">DEMOSTRACIÓN · DATOS FICTICIOS</div><p class="tiny">Ejemplo de Código Personal ZOKU (no es una clave real)</p><div class="sample">ZOKU-DEMO-01</div><div class="weekdays">${['Base','Técnica','Control','Recuperación','Integración'].map((x,i)=>`<div class="day">Día ${i+1}<small>${x}</small></div>`).join('')}</div><p class="demo-note">Tu código permite consultar la semana asignada y sus cinco sesiones. El contenido real depende de tu test y de los resultados que registres.</p></div>`}
function visual(title,body,symbol='✳',pills=[]){document.getElementById('visual').classList.remove('hide');document.getElementById('visual').innerHTML=`<div class="symbol" aria-hidden="true">${symbol}</div><div class="eyebrow">ZOKU · CONTROL CORPORAL</div><h2>${title}</h2><p>${body}</p><div class="mini">${pills.map(x=>`<span class="pill">${x}</span>`).join('')}</div>`}
function track(event,detail={}){
  // Medición agregada por ruta virtual; no enviamos elecciones ni datos personales.
  // Cloudflare Web Analytics debe estar habilitado en Metrics para mostrar el recorrido.
  if(event==='step_view'){
    const route='/recorrido/paso-'+String(detail.step+1).padStart(2,'0');
    if(location.pathname!==route)history.replaceState({zokuStep:detail.step},'',route);
  }else if(event==='checkout_click'){
    history.replaceState({zokuStep:7},'','/recorrido/checkout');
  }
}
function next(){if(step<7){step++;demo=0;track('step_view',{step});render()}}
function back(){if(step>0){step--;track('step_view',{step});render()}}
function choiceView(q){const selected=data[q.key];return `<div class="eyebrow">${q.tag}</div><h1 class="title">${q.title}</h1><p class="lead">${q.lead}</p><div class="choices">${q.choices.map(([id,label])=>`<button class="choice ${selected===id?'selected':''}" data-choice="${id}" aria-pressed="${selected===id}"><span>${escapeHTML(label)}</span><span class="arrow">${selected===id?'✓':'→'}</span></button>`).join('')}</div>${selected?`<div class="reply"><strong>ZOKU te responde</strong>${q.choices.find(c=>c[0]===selected)[2]}</div>`:''}<div class="actions">${step>0?'<button class="btn secondary" id="back">← Volver</button>':''}<button class="btn" id="next" ${!selected?'disabled':''}>Continuar →</button></div>`}
function render(){const content=document.getElementById('content');document.getElementById('visual').classList.add('hide');document.getElementById('counter').textContent=String(step+1).padStart(2,'0')+' / 08';document.getElementById('bar').style.width=((step+1)/8*100)+'%';
if(step<4){const q=questions[step];content.innerHTML=choiceView(q);if(data[q.key])visual(['Domina tu cuerpo','Tu punto de partida importa','Control + fuerza','Una semana con propósito'][step],['Fuerza específica · Estabilidad · Técnica','Test inicial · Progresiones · Seguimiento','Integra el trabajo sin duplicar cargas','5 sesiones · Aproximadamente 40 minutos'][step],['✦','◎','◉','▦'][step],['12 semanas','Progreso registrado']);content.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{data[q.key]=b.dataset.choice;render();track('answer',{question:q.key})});}
else if(step===4){const d=demoItems[demo];content.innerHTML=`<div class="eyebrow">05 · ASÍ FUNCIONA</div><h1 class="title">No necesitas adivinar qué hacer cada semana.</h1><p class="lead">Explora cómo funciona el proceso dentro de ZOKU Control.</p><div class="demo-tabs">${demoItems.map((x,i)=>`<button data-demo="${i}" class="${demo===i?'active':''}">${i+1}. ${x.name}</button>`).join('')}</div><div class="reply"><strong>${d.title}</strong>${d.body}<p>✓ ${d.tag}</p></div>${demo===0||demo===1?weeklyPreview():''}<p class="notice">Tu entrenamiento no termina cuando completas una sesión. Tus resultados ayudan a orientar cómo continuar.</p><div class="actions"><button class="btn secondary" id="back">← Volver</button><button class="btn" id="next">¿Y si necesito ayuda? →</button></div>`;visual(d.title,d.body,d.symbol,[d.tag]);content.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{demo=Number(b.dataset.demo);render()});}
else if(step===5){const q=questions[4];content.innerHTML=choiceView(q);if(data.help)visual('No tienes que resolverlo todo por tu cuenta','Puedes consultar explicaciones de los ejercicios y plantear tus dudas en el foro semanal con el equipo ZOKU. Así tendrás una referencia cuando necesites aclarar cómo continuar.','☷',['Explicaciones','Foro semanal']);content.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{data.help=b.dataset.choice;render();track('answer',{question:'help'})});}
else if(step===6){content.innerHTML=`<div class="eyebrow">07 · TU CAMINO CON ZOKU</div><h1 class="title">${goalHead[data.goal]||'Tu camino hacia el control corporal'}</h1><p class="lead">${difficultyHead[data.difficulty]||'Entrena con dirección y seguimiento.'}</p><div class="summary"><strong>Lo que identificaste en esta conversación</strong><p>${obstacleHead[data.obstacle]||'Cada semana necesita un propósito claro.'}</p><p>${helpHead[data.help]||'Tener una referencia técnica puede ayudarte a continuar.'}</p></div><div class="summary"><strong>Cómo se integraría a tu entrenamiento</strong><p>${strengthHead[data.strength]||'La carga de entrenamiento debe adaptarse a tu situación.'}</p><p class="tiny">Este recorrido es orientativo: el test inicial se realiza después de ingresar a ZOKU y es el que sirve para asignar progresiones.</p></div><div class="checklist">${['Sistema Control de 12 semanas','Test inicial y Código Personal ZOKU','5 sesiones organizadas por semana','Registro y ajustes de progresión','Biblioteca de ejercicios y foro semanal','Recursos opcionales de 30 días y movilidad'].map(x=>`<div class="check">${x}</div>`).join('')}</div><div class="actions"><button class="btn secondary" id="back">← Volver</button><button class="btn" id="next">Conocer cómo empezar →</button></div>`;visual('Tu punto de partida. Tu proceso. Tu evolución.','Tus respuestas muestran qué quieres trabajar y qué suele dificultarlo. La progresión real se asigna con el test inicial dentro del programa.','↗',['Fuerza','Estabilidad','Control']);}
else{content.innerHTML=`<div class="eyebrow">08 · COMIENZA TU EVOLUCIÓN</div><h1 class="title">Un proceso para trabajar lo que hoy necesitas.</h1><p class="lead">${offerHead[data.goal]||"El objetivo es desarrollar control corporal con una estructura clara."} ${obstacleHead[data.obstacle]||""}</p><div class="summary"><strong>Si decides comenzar</strong><p>Dentro del programa harás el test inicial, recibirás tu Código Personal ZOKU y podrás consultar cinco sesiones semanales durante un recorrido de 12 semanas. Esta conversación no sustituye el test ni asigna una rutina.</p></div><p class="old">Precio habitual: $39 USD/mes</p><div class="price">$29 USD <span style="font-size:18px;font-weight:500">/mes</span></div><p class="lead">Con el código promo, los $29 USD se mantienen todos los meses de tu suscripción.</p><p class="tiny">CÓDIGO PROMO · SOLO PARA EL CHECKOUT, DIFERENTE DE TU CÓDIGO PERSONAL ZOKU</p><div class="code"><strong>${CODE}</strong><button class="btn secondary" id="copy">Copiar código promo</button></div><div class="actions"><a class="btn" href="${CHECKOUT}" target="_blank" rel="noopener noreferrer" id="checkout">Comenzar mi evolución ↗</a><button class="btn secondary" id="back">← Revisar</button></div><p class="tiny">Copia el código promo y aplícalo en el checkout de SchoolMaker. Verifica que el descuento aparezca antes de confirmar el pago.</p>`;visual('CONTROL DE TU CUERPO','No necesitas dominar una habilidad para comenzar. Comienza desarrollando las capacidades que te acercan a ella.','✳',['12 semanas','5 sesiones por semana']);document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(CODE);document.getElementById('copy').textContent='¡Copiado!'}catch(e){const el=document.getElementById('copy');el.textContent='Selecciona el código para copiarlo';}};document.getElementById('checkout').onclick=()=>track('checkout_click');}
const b=document.getElementById('back'),n=document.getElementById('next');if(b)b.onclick=back;if(n)n.onclick=next;window.scrollTo({top:0,behavior:'instant'});}
document.getElementById('reset').onclick=()=>{step=0;demo=0;Object.keys(data).forEach(k=>data[k]=null);track('step_view',{step});render()};track('step_view',{step});render();
</script></body></html>
